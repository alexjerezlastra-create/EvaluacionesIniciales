function seed(){const c=id(),cy=id(),cl=id(),sid=id(),en=id(),ev=id();return{schemaVersion:26,selected:{courseId:c,cycleId:null,classId:null,studentId:null,evaluationId:null},courses:[{id:c,name:'2026-2027',active:true}],cycles:[{id:cy,courseId:c,name:'Ciclo Infantil',open:true}],classes:[{id:cl,cycleId:cy,name:'Aula Verde',tutor:'',professionals:'',notes:''}],students:[{id:sid,name:'Alumno/a de ejemplo',birth:'',active:true}],enrollments:[{id:en,studentId:sid,classId:cl,courseId:c,startDate:new Date().toISOString().slice(0,10),endDate:null,status:'active'}],evaluations:[{id:ev,studentId:sid,enrollmentId:en,courseId:c,classId:cl,title:'Evaluación inicial',date:new Date().toISOString().slice(0,10),status:'draft',updatedAt:new Date().toISOString(),data:evaluationData()}],promotions:[]}}

const byId=(a,x)=>a.find(v=>v.id===x),course=()=>byId(db.courses,db.selected.courseId),selectedCycle=()=>byId(db.cycles,db.selected.cycleId),room=()=>byId(db.classes,db.selected.classId),cycleOf=c=>c?byId(db.cycles,c.cycleId):null,student=()=>byId(db.students,db.selected.studentId),contextEnrollment=(sid=student()?.id)=>db.enrollments.find(x=>x.studentId===sid&&x.courseId===db.selected.courseId&&(!db.selected.classId||x.classId===db.selected.classId))||db.enrollments.find(x=>x.studentId===sid&&x.courseId===db.selected.courseId),activeEnrollment=(sid=student()?.id)=>db.enrollments.find(x=>x.studentId===sid&&x.status==='active'),evaluation=()=>byId(db.evaluations,db.selected.evaluationId),evaluationsForEnrollment=en=>db.evaluations.filter(x=>x.enrollmentId===en?.id||(x.studentId===en?.studentId&&x.courseId===en?.courseId&&x.classId===en?.classId)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

function renderTree(){courseSelect.innerHTML=db.courses.map(c=>`<option value="${c.id}" ${c.id===db.selected.courseId?'selected':''}>${esc(c.name)}</option>`).join('');tree.innerHTML=db.cycles.filter(x=>x.courseId===db.selected.courseId).map(cy=>`<div class="treeCycle"><div class="cycleRow"><button class="cycleToggle" title="${cy.open?'Colapsar':'Expandir'}" onclick="event.stopPropagation();toggleCycle('${cy.id}')">${cy.open?'−':'+'}</button><button class="cycleName ${cy.id===db.selected.cycleId&&!db.selected.classId?'on':''}" onclick="openCycle('${cy.id}')">${esc(cy.name)}</button></div><div class="rooms ${cy.open?'':'hidden'}">${db.classes.filter(x=>x.cycleId===cy.id).map(r=>{const rows=studentsInClass(r.id),opened=r.id===db.selected.classId;return`<div class="treeRoom"><div class="roomRow"><button class="roomToggle" title="${opened?'Ocultar alumnos':'Mostrar alumnos'}" onclick="event.stopPropagation();toggleRoom('${r.id}')">${opened?'−':'+'}</button><button class="room ${opened&&!db.selected.studentId?'on':''}" onclick="openClass('${r.id}')">${esc(r.name)} <span class="roomCount">${rows.length}</span></button></div><div class="treeStudents ${opened?'':'hidden'}">${rows.map(({student:st,enrollment:en})=>{const promoted=en.status==='completed'&&db.promotions.some(p=>p.fromEnrollmentId===en.id);return`<button class="treeStudent ${st.id===db.selected.studentId?'on':''}" onclick="openStudent('${st.id}')"><span>${esc(st.name)}</span>${promoted?'<small>P</small>':en.status==='active'?'<small>A</small>':''}</button>`}).join('')||'<div class="muted treeEmpty">Sin alumnos</div>'}</div></div>`}).join('')||'<div class="muted treeEmpty">Sin aulas</div>'}</div></div>`).join('')}

async function initGisOnly(){
  if(gisInited&&tokenClient)return true;
  if(!window.google?.accounts?.oauth2)return false;
  try{
    tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:()=>{}});
    gisInited=true;
    return true;
  }catch(e){console.warn('GIS init error',e);return false;}
}

async function initGapiClientOnly(){
  if(gapiInited&&window.gapi?.client?.drive)return true;
  if(!window.gapi?.load)return false;
  try{
    await new Promise((resolve,reject)=>gapi.load('client',{callback:resolve,onerror:()=>reject(Error('gapi.load error')),timeout:6000,ontimeout:()=>reject(Error('gapi.load timeout'))}));
    if(!window.gapi?.client?.init)return false;
    await gapi.client.init({discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']});
    gapiInited=true;
    return true;
  }catch(e){console.warn('GAPI init error',e);return false;}
}

async function initializeGoogleLibraries(){
  if(location.protocol==='file:'){
    gateStatus('Estás abriendo el archivo como file://. Google bloquea el acceso en local sin servidor; ábrelo por http://localhost o HTTPS.',true);
    return false;
  }
  gateStatus('Preparando acceso a Google…');
  const started=Date.now();
  let lastErr='';
  while(Date.now()-started<15000){
    const okGis=await initGisOnly();
    const okGapi=await initGapiClientOnly();
    if(okGis&&okGapi){
      gateStatus('Google preparado ✓');
      return true;
    }
    if(!okGis)lastErr='Esperando Google Identity Services (gsi/client)…';
    else if(!okGapi)lastErr='Esperando Google API Client (gapi/client)…';
    gateStatus(lastErr);
    await new Promise(r=>setTimeout(r,300));
  }
  gateStatus('Tiempo de espera agotado al cargar Google ('+(lastErr||'sin detalle')+'). Revisa bloqueadores de anuncios/scripts o la consola (F12).',true);
  return false;
}

// Web Crypto: PBKDF2 + AES-GCM
function bytesToB64(bytes){
  let bin='';
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToBytes(b64){
  const bin=atob(b64);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}
async function deriveAesKey(password,saltBytes,iterations=KDF_ITERATIONS){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),{name:'PBKDF2'},false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:saltBytes,iterations,hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM',length:256},
    false,
    ['encrypt','decrypt']
  );
}
async function encryptDatabase(obj,password){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveAesKey(password,salt,KDF_ITERATIONS);
  const plaintext=new TextEncoder().encode(JSON.stringify(obj));
  const cipherBuffer=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plaintext);
  return JSON.stringify({
    v:1,
    kdf:'PBKDF2-SHA256',
    iterations:KDF_ITERATIONS,
    salt:bytesToB64(salt),
    iv:bytesToB64(iv),
    ciphertext:bytesToB64(new Uint8Array(cipherBuffer))
  },null,2);
}
async function decryptDatabase(rawText,password){
  const pkg=JSON.parse(rawText);
  if(!pkg||!pkg.salt||!pkg.iv||!pkg.ciphertext)throw new Error('Formato de archivo cifrado no válido.');
  const salt=b64ToBytes(pkg.salt);
  const iv=b64ToBytes(pkg.iv);
  const cipherBytes=b64ToBytes(pkg.ciphertext);
  const iterations=Number(pkg.iterations)||KDF_ITERATIONS;
  const key=await deriveAesKey(password,salt,iterations);
  const plainBuffer=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipherBytes);
  const parsed=JSON.parse(new TextDecoder().decode(plainBuffer));
  if(!parsed||!Array.isArray(parsed.courses)||!Array.isArray(parsed.students)||!Array.isArray(parsed.evaluations)){
    throw new Error('Los datos descifrados no tienen la estructura esperada.');
  }
  return parsed;
}

async function startDriveLogin(){
  if(location.protocol==='file:'){
    gateStatus('No funciona desde file://. Súbelo a HTTPS o ábrelo con un servidor local (localhost).',true);
    return;
  }
  await initGisOnly();
  if(!tokenClient){
    await waitGoogleReady();
  }
  if(!tokenClient){
    gateStatus('No se ha podido inicializar Google Identity Services. Comprueba bloqueadores (uBlock/Brave Shields) o la consola (F12).',true);
    return;
  }
  gateStatus('Abriendo ventana de inicio de sesión de Google…');
  tokenClient.callback=async(resp)=>{
    if(resp&&resp.error){
      gateStatus('Error de autorización de Google: '+resp.error,true);
      return;
    }
    await loadDriveStateAfterLogin();
  };
  let existingToken=null;
  try{existingToken=window.gapi?.client?.getToken?.()||null;}catch(_e){existingToken=null;}
  try{
    tokenClient.requestAccessToken({prompt:existingToken?'':'consent'});
  }catch(err){
    console.error('requestAccessToken error:',err);
    gateStatus('No se pudo abrir la ventana de Google: '+(err?.message||err)+'. Revisa si el navegador bloquea ventanas emergentes.',true);
  }
}

function getAccessToken(){
  return gapi.client.getToken()?.access_token||'';
}

async function findDriveFileByName(name){
  const res=await gapi.client.drive.files.list({
    q:`name='${name.replace(/'/g,"\'")}' and trashed=false`,
    fields:'files(id,name,modifiedTime)',
    spaces:'drive'
  });
  const files=res.result?.files||[];
  return files[0]||null;
}

async function downloadDriveFileText(fileId){
  const token=getAccessToken();
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`,{
    headers:{Authorization:'Bearer '+token}
  });
  if(!r.ok)throw new Error('No se pudo descargar el archivo de Google Drive ('+r.status+')');
  return r.text();
}

function buildMultipartBody(metadata,blob){
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
  form.append('file',blob);
  return form;
}

async function createEncryptedDriveFile(encText){
  const token=getAccessToken();
  const metadata={name:DRIVE_FILE_NAME,mimeType:'application/json'};
  const blob=new Blob([encText],{type:'application/json'});
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',
    headers:{Authorization:'Bearer '+token},
    body:buildMultipartBody(metadata,blob)
  });
  if(!r.ok)throw new Error('No se pudo crear el archivo cifrado en Drive ('+r.status+')');
  const created=await r.json();
  driveFileId=created.id;
  return created;
}

async function updateEncryptedDriveFile(fileId,encText){
  const token=getAccessToken();
  const metadata={name:DRIVE_FILE_NAME,mimeType:'application/json'};
  const blob=new Blob([encText],{type:'application/json'});
  const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=multipart`,{
    method:'PATCH',
    headers:{Authorization:'Bearer '+token},
    body:buildMultipartBody(metadata,blob)
  });
  if(!r.ok)throw new Error('No se pudo actualizar el archivo cifrado en Drive ('+r.status+')');
  return r.json();
}

async function syncDatabaseToDriveNow(){
  if(!driveReady||!cryptoPassword)return;
  const token=getAccessToken();
  if(!token){
    setSaveStatus('Sesión de Google caducada · Pulsa para reconectar');
    return;
  }
  try{
    setSaveStatus('Cifrando y guardando en Drive…');
    const encText=await encryptDatabase(db,cryptoPassword);
    if(driveFileId){
      await updateEncryptedDriveFile(driveFileId,encText);
    }else{
      const existing=await findDriveFileByName(DRIVE_FILE_NAME);
      if(existing){
        driveFileId=existing.id;
        await updateEncryptedDriveFile(driveFileId,encText);
      }else{
        await createEncryptedDriveFile(encText);
      }
    }
    setSaveStatus('Sincronizado en Drive ✓');
  }catch(e){
    console.error('Error sincronizando con Drive:',e);
    setSaveStatus('Error al guardar en Drive');
  }
}

function scheduleDriveSync(){
  if(!driveReady||!cryptoPassword)return;
  clearTimeout(driveSaveTimer);
  driveSaveTimer=setTimeout(()=>{
    driveSaveTimer=null;
    syncDatabaseToDriveNow();
  },700);
}

// Envolvemos save() y changed() para persistir localmente y programar sincronización cifrada con Drive
const _baseSave=save;
save=function(){
  _baseSave();
  if(driveReady&&cryptoPassword)scheduleDriveSync();
};
const _baseChanged=changed;
changed=function(){
  _baseChanged();
  if(driveReady&&cryptoPassword)scheduleDriveSync();
};

async function loadDriveStateAfterLogin(){
  try{
    gateStatus('Buscando archivo cifrado en Google Drive…');
    const encFile=await findDriveFileByName(DRIVE_FILE_NAME);
    if(encFile){
      driveFileId=encFile.id;
      showDriveGate(
        'Desbloquear evaluaciones',
        'Introduce tu contraseña maestra para descifrar los datos guardados en Google Drive.',
        `<div class="drivePasswordFields">
          <label>Contraseña maestra<input id="unlockPasswordInput" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitUnlockPassword()"></label>
        </div>
        <button type="button" class="driveGatePrimary" onclick="submitUnlockPassword()">Desbloquear</button>`,
        ''
      );
      setTimeout(()=>document.getElementById('unlockPasswordInput')?.focus(),20);
      return;
    }

    const legacyFile=await findDriveFileByName(LEGACY_DRIVE_FILE_NAME);
    if(legacyFile){
      gateStatus('Se ha encontrado una copia anterior sin cifrar. Preparando migración…');
      const rawLegacy=await downloadDriveFileText(legacyFile.id);
      const parsedLegacy=JSON.parse(rawLegacy);
      if(!parsedLegacy||!Array.isArray(parsedLegacy.courses)){
        throw new Error('El archivo legado encontrado no tiene un formato válido.');
      }
      pendingLegacyDb=parsedLegacy;
      renderCreatePasswordGate('Se encontró una copia anterior en Drive. Crea una contraseña maestra para cifrarla y guardarla en el nuevo formato.');
      return;
    }

    pendingLegacyDb=null;
    renderCreatePasswordGate('No existe ningún archivo cifrado en tu Google Drive todavía. Crea una contraseña maestra para iniciar tu base de datos cifrada.');
  }catch(e){
    console.error(e);
    showDriveGate(
      'Error al conectar con Google Drive',
      'No se pudo comprobar o descargar el archivo desde tu cuenta de Google Drive.',
      `<button type="button" class="driveGatePrimary" onclick="startDriveLogin()">Reintentar conexión</button>`,
      e.message||String(e),
      true
    );
  }
}

function renderCreatePasswordGate(description){
  showDriveGate(
    'Crear contraseña maestra',
    description,
    `<div class="drivePasswordFields">
      <label>Nueva contraseña maestra<input id="createPass1" type="password" autocomplete="new-password"></label>
      <label>Repetir contraseña maestra<input id="createPass2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitCreatePassword()"></label>
    </div>
    <div class="drivePasswordHint">Esta contraseña cifra tus datos en tu navegador antes de subirlos a Drive. Si la pierdes, no podrán recuperarse.</div>
    <button type="button" class="driveGatePrimary" onclick="submitCreatePassword()">Crear y guardar en Drive</button>`,
    ''
  );
  setTimeout(()=>document.getElementById('createPass1')?.focus(),20);
}

async function submitUnlockPassword(){
  const input=document.getElementById('unlockPasswordInput');
  const pwd=input?.value||'';
  if(!pwd){gateStatus('Introduce la contraseña maestra.',true);return;}
  try{
    gateStatus('Descifrando datos…');
    const rawEnc=await downloadDriveFileText(driveFileId);
    const decrypted=await decryptDatabase(rawEnc,pwd);
    cryptoPassword=pwd;
    applyLoadedDatabase(decrypted);
  }catch(e){
    console.error(e);
    gateStatus('Contraseña incorrecta o archivo dañado.',true);
    input?.focus();
    input?.select();
  }
}

async function submitCreatePassword(){
  const p1=document.getElementById('createPass1')?.value||'';
  const p2=document.getElementById('createPass2')?.value||'';
  if(p1.length<6){gateStatus('Usa una contraseña de al menos 6 caracteres.',true);return;}
  if(p1!==p2){gateStatus('Las contraseñas no coinciden.',true);return;}
  try{
    gateStatus('Cifrando y creando archivo en Google Drive…');
    cryptoPassword=p1;
    const initialDb=pendingLegacyDb?clone(pendingLegacyDb):seed();
    pendingLegacyDb=null;
    const encText=await encryptDatabase(initialDb,cryptoPassword);
    await createEncryptedDriveFile(encText);
    applyLoadedDatabase(initialDb);
  }catch(e){
    console.error(e);
    gateStatus('Error al crear el archivo cifrado en Drive: '+(e.message||e),true);
  }
}

function applyLoadedDatabase(loaded){
  db=loaded;
  migrate();
  db.classes.forEach(ensureRoomProfessionals);
  db.evaluations.forEach(ev=>ev.data=normalizeEvaluationData(ev.data));
  if(!byId(db.courses,db.selected.courseId)&&db.courses[0]){
    db.selected.courseId=db.courses[0].id;
  }
  driveReady=true;
  hideDriveGate();
  _baseSave();
  render();
  setSaveStatus('Conectado a Drive ✓');
}

function updateActiveEvalTab(){const tabs=document.querySelectorAll('.tabs button');if(!tabs.length)return;let current='';document.querySelectorAll('.section[id]').forEach(sec=>{if(sec.getBoundingClientRect().top<=170)current=sec.id});tabs.forEach(btn=>{const target=(btn.getAttribute('onclick')||'').match(/goSection\('([^']+)'\)/)?.[1];btn.classList.toggle('activeTab',Boolean(current&&target===current))})}
window.addEventListener('scroll',updateActiveEvalTab,{passive:true});
function goSection(x){document.getElementById(x)?.scrollIntoView({behavior:'smooth',block:'start'})}
function strengthHTML(d){d=normalizeEvaluationData(d);return`<section id="strength" class="card section"><div class="head"><h2>Fortalezas e intereses</h2><button type="button" class="btn sm noprint" onclick="addFlexibleField('strengthFields')">+ Añadir apartado</button></div><div class="grid">${d.strengthFields.map((f,i)=>flexibleFieldHTML('strengthFields',i,f)).join('')}</div></section>`}
function participationHTML(d){return`<section id="part" class="card section"><div class="head"><h2>Participación y contexto</h2><button type="button" class="btn sm noprint" onclick="addParticipation()">+ Añadir subapartado</button></div>${d.participation.map((p,pi)=>`<div class="card contextBox"><div class="head"><h3 contenteditable="true" oninput="evalData().participation[${pi}].title=this.innerText;changed()" onblur="evalData().participation[${pi}].title=this.innerText.trim()||'Subapartado';changed()">${esc(p.title)}</h3><div class="noprint"><button type="button" class="btn sm" onclick="addParticipationOption(${pi})">+ Opción</button><button type="button" class="btn sm danger" onclick="deleteParticipation(${pi})">Borrar</button></div></div><div class="chips">${p.options.map((o,oi)=>`<div class="chip"><input type="checkbox" ${o.checked?'checked':''} onchange="evalData().participation[${pi}].options[${oi}].checked=this.checked;changed()"><span contenteditable="true" oninput="evalData().participation[${pi}].options[${oi}].text=this.innerText;changed()" onblur="evalData().participation[${pi}].options[${oi}].text=this.innerText.trim()||'Opción';changed()">${esc(o.text)}</span><button type="button" class="btn sm danger noprint" onclick="deleteParticipationOption(${pi},${oi})">×</button></div>`).join('')}</div></div>`).join('')}</section>`}
function areaHTML(a,ai){return`<section id="area${ai}" class="card area section"><div class="areaHead"><div><h2 contenteditable="true" oninput="evalData().areas[${ai}].title=this.innerText;changed()" onblur="evalData().areas[${ai}].title=this.innerText.trim()||'Área';changed()">${esc(a.title)}</h2><div class="legend"><span>C · Conseguido</span><span>AP · Aparece con apoyo</span><span>N/O · No observado</span></div></div><div class="noprint"><button type="button" class="btn sm" onclick="addBlockV22(${ai})">+ Bloque</button><button type="button" class="btn sm danger" onclick="deleteAreaV22(${ai})">Borrar área</button></div></div><div class="areaBody">${a.blocks.map((b,bi)=>blockHTMLV22(b,ai,bi)).join('')}</div></section>`}
function blockHTMLV22(b,ai,bi){return`<div class="block"><div class="blockTitle"><h3 contenteditable="true" oninput="evalData().areas[${ai}].blocks[${bi}].title=this.innerText;changed()" onblur="evalData().areas[${ai}].blocks[${bi}].title=this.innerText.trim()||'Bloque';changed()">${esc(b.title)}</h3><div class="noprint"><button type="button" class="btn sm" onclick="addIndicatorV22(${ai},${bi})">+ Indicador</button><button type="button" class="btn sm danger" onclick="deleteBlockV22(${ai},${bi})">Borrar</button></div></div><div style="overflow:auto"><table><thead><tr><th>Indicador</th><th>C</th><th>AP</th><th>N/O</th><th>Observaciones / contexto</th><th class="noprint">Acción</th></tr></thead><tbody>${b.indicators.map((i,ii)=>indicatorHTMLV22(i,ai,bi,ii)).join('')}</tbody></table></div><div class="nextBox">${editableField('Zona de desarrollo próximo',`areas.${ai}.blocks.${bi}.next`,b.next,'full')}</div></div>`}
function indicatorHTMLV22(i,ai,bi,ii){return`<tr><td contenteditable="true" oninput="evalData().areas[${ai}].blocks[${bi}].indicators[${ii}].text=this.innerText;changed()" onblur="evalData().areas[${ai}].blocks[${bi}].indicators[${ii}].text=this.innerText.trim()||'Indicador';changed()">${esc(i.text)}</td>${['C','AP','N/O'].map(x=>`<td class="score"><input type="radio" name="${i.id}" ${i.score===x?'checked':''} onchange="scoreV22(${ai},${bi},${ii},'${x}')"></td>`).join('')}<td><textarea class="obs" oninput="evalData().areas[${ai}].blocks[${bi}].indicators[${ii}].obs=this.value;changed();grow(this)">${esc(i.obs||'')}</textarea></td><td class="noprint"><button type="button" class="btn sm" onclick="clearScoreV22(${ai},${bi},${ii})">Limpiar</button> <button type="button" class="btn sm danger" onclick="deleteIndicatorV22(${ai},${bi},${ii})">Borrar</button></td></tr>${i.score==='AP'?apHTMLV22(i,ai,bi,ii):''}`}
function apHTMLV22(i,ai,bi,ii){return`<tr class="apRow"><td colspan="6"><div class="apPanel"><div class="head"><b>Apoyo asociado a este indicador</b><button type="button" class="btn sm noprint" onclick="addAPOptionV22(${ai},${bi},${ii})">+ Opción</button></div><div class="apOptions">${i.ap.options.map((o,oi)=>`<div class="chip"><input type="checkbox" ${o.checked?'checked':''} onchange="evalData().areas[${ai}].blocks[${bi}].indicators[${ii}].ap.options[${oi}].checked=this.checked;changed()"><span contenteditable="true" oninput="evalData().areas[${ai}].blocks[${bi}].indicators[${ii}].ap.options[${oi}].text=this.innerText;changed()" onblur="evalData().areas[${ai}].blocks[${bi}].indicators[${ii}].ap.options[${oi}].text=this.innerText.trim()||'Opción';changed()">${esc(o.text)}</span><button type="button" class="btn sm danger noprint" onclick="deleteAPOptionV22(${ai},${bi},${ii},${oi})">×</button></div>`).join('')}</div><div class="apGrid">${[['what','Qué apoyo'],['how','Cómo se proporciona'],['when','Cuándo / situación'],['detail','Con quién / detalle']].map(([k,l])=>editableField(l,`areas.${ai}.blocks.${bi}.indicators.${ii}.ap.${k}`,i.ap[k])).join('')}</div></div></td></tr>`}
function summaryHTML(d){d=normalizeEvaluationData(d);return`<section id="summary" class="card section"><div class="head"><h2>Síntesis final</h2><button type="button" class="btn sm noprint" onclick="addFlexibleField('summaryFields')">+ Añadir apartado</button></div><div class="grid">${d.summaryFields.map((f,i)=>flexibleFieldHTML('summaryFields',i,f)).join('')}</div><div class="head prioritiesHead"><h3>Prioridades funcionales</h3><button type="button" class="btn sm noprint" onclick="addPriorityV22()">+ Prioridad</button></div>${d.priorities.map((v,i)=>`<div class="priority"><div class="pnum">${i+1}</div><input value="${esc(v)}" oninput="setData('priorities.${i}',this.value)"><button type="button" class="btn sm danger noprint" onclick="deletePriorityV22(${i})">Borrar</button></div>`).join('')}</section>`}
function refreshEvalKeepScroll(){const y=window.scrollY;evalObj().updatedAt=new Date().toISOString();renderEvaluation(student(),evalObj());save();requestAnimationFrame(()=>window.scrollTo(0,y))}
function scoreV22(a,b,i,v){evalData().areas[a].blocks[b].indicators[i].score=v;refreshEvalKeepScroll()}function clearScoreV22(a,b,i){evalData().areas[a].blocks[b].indicators[i].score='';refreshEvalKeepScroll()}
function addParticipation(){evalData().participation.push(contextFull('Nuevo subapartado',['Nueva opción']));refreshEvalKeepScroll()}function deleteParticipation(i){if(confirm('¿Borrar este subapartado?')){evalData().participation.splice(i,1);refreshEvalKeepScroll()}}function addParticipationOption(i){evalData().participation[i].options.push(apOption('Nueva opción'));refreshEvalKeepScroll()}function deleteParticipationOption(i,j){evalData().participation[i].options.splice(j,1);refreshEvalKeepScroll()}
function addAreaV22(){evalData().areas.push({id:id(),title:'Nueva área',blocks:[blockFull('Nuevo bloque',['Nuevo indicador'])]});refreshEvalKeepScroll()}function deleteAreaV22(i){if(confirm('¿Borrar esta área?')){evalData().areas.splice(i,1);refreshEvalKeepScroll()}}function addBlockV22(a){evalData().areas[a].blocks.push(blockFull('Nuevo bloque',['Nuevo indicador']));refreshEvalKeepScroll()}function deleteBlockV22(a,b){if(confirm('¿Borrar este bloque?')){evalData().areas[a].blocks.splice(b,1);refreshEvalKeepScroll()}}function addIndicatorV22(a,b){evalData().areas[a].blocks[b].indicators.push(indicatorFull('Nuevo indicador'));refreshEvalKeepScroll()}function deleteIndicatorV22(a,b,i){if(confirm('¿Borrar este indicador?')){evalData().areas[a].blocks[b].indicators.splice(i,1);refreshEvalKeepScroll()}}function addAPOptionV22(a,b,i){evalData().areas[a].blocks[b].indicators[i].ap.options.push(apOption('Nueva opción'));refreshEvalKeepScroll()}function deleteAPOptionV22(a,b,i,j){evalData().areas[a].blocks[b].indicators[i].ap.options.splice(j,1);refreshEvalKeepScroll()}function addPriorityV22(){if(evalData().priorities.length>=5)return alert('Máximo 5 prioridades.');evalData().priorities.push('');refreshEvalKeepScroll();setTimeout(()=>{const inputs=document.querySelectorAll('.priority input');inputs[inputs.length-1]?.focus()},20)}function deletePriorityV22(i){if(evalData().priorities.length<=3)return alert('Mantén al menos 3 prioridades.');evalData().priorities.splice(i,1);refreshEvalKeepScroll()}
function exportStudentEvaluation(){download({schemaVersion:22,type:'student-evaluation',student:clone(student()),evaluation:clone(evalObj()),course:clone(course()),cycle:clone(cycleOf(room())),classroom:clone(room())},`evaluacion_${student().name.replace(/[^a-z0-9_-]+/gi,'_')}_V22.json`)}
function importStudentEvaluation(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),d=x.evaluation?.data||x.data||x;if(!d.areas||!d.summary)throw Error();if(confirm('Se reemplazará la evaluación abierta. ¿Continuar?')){evalObj().data=normalizeEvaluationData(d);refreshEvalKeepScroll()}}catch{alert('Evaluación no válida')}};r.readAsText(f);ev.target.value=''}

db.schemaVersion=26;renderTree();content.innerHTML='<div class="lockedPlaceholder"></div>';setSaveStatus('Esperando acceso a Google Drive…');
</script></body></html>
